name: KC Stats
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Generate SVGs
        env:
          # PAT (read:user) as secret KC_STATS_TOKEN includes private contributions; fallback = public only
          GH_TOKEN: ${{ secrets.KC_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/kc_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "chore(stats): daily KC stats refresh" && git push)
